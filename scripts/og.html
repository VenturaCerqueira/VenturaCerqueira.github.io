<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  /* Cartão de compartilhamento 1200x630 (LinkedIn, WhatsApp, X). Gerado por scripts/build-og.js */
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Plus Jakarta Sans", Arial, sans-serif; color: #fff;
    background: radial-gradient(700px 500px at 0% 0%, #5b3df5 0%, transparent 60%), radial-gradient(600px 500px at 100% 100%, #0f8a7e 0%, transparent 60%), #0b0d18; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 48px 48px; }
  .wrap { position: relative; display: flex; height: 100%; padding: 64px 70px; gap: 56px; align-items: center; }
  .left { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 99px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); font-size: 20px; font-weight: 700; }
  .dot { width: 12px; height: 12px; border-radius: 99px; background: #3fd4c2; box-shadow: 0 0 0 6px rgba(63,212,194,.25); }
  h1 { margin-top: 26px; font-size: 76px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
  .role { margin-top: 18px; font-size: 32px; font-weight: 700; }
  .badge { display: inline-block; margin-left: 10px; padding: 2px 14px; border-radius: 12px; background: linear-gradient(90deg, #8b7bff, #6ea0ff); }
  .tags { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px; }
  .tags span { padding: 7px 14px; border-radius: 12px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); font-size: 20px; font-weight: 600; }
  .url { margin-top: 30px; font-size: 22px; font-weight: 700; color: #a99dfd; }
  .photo { width: 330px; height: 430px; border-radius: 36px; padding: 5px; background: conic-gradient(from 200deg, #5b3df5, #2f6bdc, #3fd4c2, #f5a524, #5b3df5); box-shadow: 0 30px 80px rgba(91,61,245,.45); flex-shrink: 0; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; border-radius: 31px; display: block; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <span class="pill"><span class="dot"></span><span id="available"></span></span>
      <h1>Anderson<br />Ventura</h1>
      <p class="role"><span id="role"></span><span class="badge" id="level"></span></p>
      <div class="tags" id="tags"></div>
      <p class="url">venturacerqueira.github.io</p>
    </div>
    <div class="photo"><img src="../public/foto-anderson.jpg" alt="" /></div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("available").textContent = q.get("available");
  document.getElementById("role").textContent = q.get("role");
  document.getElementById("level").textContent = q.get("level");
  document.getElementById("tags").innerHTML = q.get("tags").split("|").map((t) => `<span>${t}</span>`).join("");
</script>
</body>
</html>
